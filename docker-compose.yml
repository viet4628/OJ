# CodeJudge VN — Judge Worker + rsjudge engine (docker compose)
# Usage:  SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... docker compose up -d --build
services:
  worker:
    build:
      context: .
      dockerfile: apps/judge-worker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Engine mode: judge qua rsjudge, testcase provider ở port 50052.
      RSJUDGE_ENDPOINT: engine:50051
      RSJUDGE_PROVIDER_BIND: 0.0.0.0:50052
      WORKER_HEALTH_BIND: 0.0.0.0
      WORKER_HEALTH_PORT: 9090
      WORKER_ID: primary
      # Số bài chấm song song trong một daemon (claim nguyên tử vẫn chặn chạy trùng).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    stop_grace_period: 11m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-9090}:9090"
    mem_limit: 1g
    cpus: 2
    pids_limit: 512
    # Engine mode: the worker never runs submissions, yet holds the service-role
    # key, so it gets no capabilities and a read-only root filesystem.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks: [default, judge]

  engine:
    build:
      context: .
      dockerfile: apps/judge-worker/Dockerfile
    restart: unless-stopped
    init: true
    command:
      - rsjudge
      - --config-dir
      - /etc/rsjudge
      - --cases-endpoint
      - http://worker:50052
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    cap_add:
      - SYS_ADMIN   # required for nested bwrap mounts; submission caps are dropped
    security_opt:
      - apparmor=unconfined     # docker-default AppArmor denies the mounts bwrap makes
      - systempaths=unconfined  # masked /proc paths block bwrap's fresh procfs
      # Docker's default seccomp profile blocks pivot_root, which bwrap needs.
      # Submissions run under the engine's judge profile (seccomp.toml) instead.
      - seccomp=unconfined
      - no-new-privileges:true
    # No route out: if a submission escaped the sandbox it could reach only the worker.
    networks: [judge]

# Ghi chú: chỉ nên chạy 1 instance worker / DB (claim chống trùng qua cập nhật
# trạng thái PENDING->JUDGING). Muốn scale: tách queue PG notify/Redis trước.

networks:
  judge:
    internal: true
